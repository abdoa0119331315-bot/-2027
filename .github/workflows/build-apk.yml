name: Build Bank AlHaz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate project
        run: |
          test -f BankAlHaz_Android/app/src/main/assets/index.html
          test -f BankAlHaz_Android/app/src/main/java/com/bankalhaz/game/MainActivity.java

      - name: Build release-ready debug APK
        working-directory: BankAlHaz_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: BankAlHaz-debug-APK
          path: BankAlHaz_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
