<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b25"><title>بنك الحظ</title>
<style>
:root{--gold:#f2c66d;--cream:#fff4d9;--green:#123c31;--panel:#1b5141;--red:#d85c4b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28604c,#0b211d);color:var(--cream);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #ffffff25}h1{font-size:clamp(18px,3vw,27px);margin:0;color:var(--gold)}.sub{font-size:11px;color:#c8d8c9}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:bold;font-size:14px;background:linear-gradient(#ffdc8d,#d99c37);color:#38260c;box-shadow:0 3px 0 #8a5d20;cursor:pointer}button:disabled{opacity:.4}
#layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:10px;padding:10px;max-width:1100px;margin:auto}
#board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,minmax(48px,1fr));gap:3px;aspect-ratio:1.18;background:#d8c49a;padding:5px;border-radius:15px;box-shadow:0 8px 24px #0007}
.tile{position:relative;background:#fff3d4;color:#2d3329;border-radius:5px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(8px,1.1vw,12px);overflow:hidden;min-width:0}
.tile .band{height:6px;width:100%;position:absolute;top:0}.tile strong{margin-top:5px}.tile small{font-size:9px}.tile .tokens{font-size:13px;letter-spacing:-3px;margin-top:2px}
.center{grid-column:2/7;grid-row:2/7;background:linear-gradient(145deg,#164a3a,#0c2b25);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.center .logo{font-size:clamp(24px,5vw,45px);color:var(--gold);font-weight:900;text-shadow:0 3px #704c1d}.center p{font-size:12px;color:#d9e6d9;margin:4px}
.side{background:#153b31;border:1px solid #ffffff25;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:#ffffff0d;border:1px solid #ffffff20;border-radius:10px;padding:8px}.card h3{margin:0 0 7px;color:var(--gold);font-size:14px}
.player{display:flex;align-items:center;gap:7px;padding:6px;border-radius:8px;background:#ffffff0b;margin:4px 0;font-size:12px}.dot{width:12px;height:12px;border-radius:50%;flex:none}.active{outline:2px solid var(--gold)}
#status{font-size:12px;line-height:1.6;min-height:50px;color:#f9e9c5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{font-size:12px;padding:9px 4px}.primary{grid-column:1/-1;background:linear-gradient(#ffe7a8,#e9ae43);font-size:15px!important}
#dice{font-size:32px;text-align:center;color:var(--gold);height:40px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.box{max-width:380px;width:100%;background:#194537;border:2px solid var(--gold);border-radius:18px;padding:18px;text-align:center;box-shadow:0 15px 50px #000}.box h2{color:var(--gold);margin-top:0}.box p{line-height:1.7}.box button{margin:5px}
footer{text-align:center;color:#9db7a9;font-size:10px;padding:4px}
@media(max-width:650px){#layout{grid-template-columns:1fr;padding:5px}#board{aspect-ratio:1;grid-template-rows:repeat(7,minmax(39px,1fr))}.side{display:grid;grid-template-columns:1fr 1fr}.side .wide{grid-column:1/-1}.player{font-size:10px}.tile{font-size:8px}.tile small{font-size:7px}}
</style></head><body>
<header><div><h1>♛ بنك الحظ</h1><div class="sub">لعبة المدن والتجارة • إصدار 1.0</div></div><button onclick="newGame()">لعبة جديدة</button></header>
<main id="layout"><section id="board"><div class="center"><div class="logo">بنك الحظ</div><p>اشترِ المدن • اجمع الإيجارات • كن أغنى لاعب</p><div id="turnLabel">ابدأ مغامرتك الآن</div></div></section>
<aside class="side"><div class="card wide"><h3>اللاعبون والأرصدة</h3><div id="players"></div></div><div class="card"><h3>النرد</h3><div id="dice">⚄ ⚄</div><div id="status">اضغط على رمي النرد لبدء اللعب.</div></div><div class="card"><h3>إدارة الدور</h3><div class="actions"><button class="primary" id="roll" onclick="rollDice()">🎲 رمي النرد</button><button id="buy" onclick="buyProperty()" disabled>شراء المدينة</button><button id="end" onclick="endTurn()" disabled>إنهاء الدور</button><button onclick="showRules()">القواعد</button><button onclick="saveGame()">حفظ</button><button onclick="loadGame()">استكمال</button></div></div></aside></main><footer>اللعبة تعمل دون إنترنت • يتم حفظ التقدم على الجهاز</footer>
<div class="modal" id="modal"><div class="box"><h2 id="mtitle">بنك الحظ</h2><p id="mbody"></p><div id="mbuttons"><button onclick="closeModal()">حسناً</button></div></div></div>
<script>
const cities=[
['البداية','start',0,'#d8bd79'],['الخرطوم','city',60,'#d85c4b'],['بطاقة حظ','chance',0],['أم درمان','city',70,'#d85c4b'],['الجزيرة','city',80,'#d85c4b'],['المحكمة','court',0],['مدني','city',90,'#e5a24a'],['كسلا','city',100,'#e5a24a'],['الأتوبيس','bus',0],['بورتسودان','city',110,'#e5a24a'],['عطبرة','city',120,'#e5a24a'],['بطاقة حظ','chance',0],['دنقلا','city',130,'#6b9fca'],['السجن','jail',0],['الأبيض','city',140,'#6b9fca'],['نيالا','city',150,'#6b9fca'],['الفاشر','city',160,'#6b9fca'],['المحكمة','court',0],['سنار','city',170,'#8e77bd'],['القضارف','city',180,'#8e77bd'],['بطاقة حظ','chance',0],['كوستي','city',190,'#8e77bd'],['الأتوبيس','bus',0],['الجنينة','city',200,'#8e77bd']];
let players=[],turn=0,rolled=false,pending=null,finished=false;
const coords=[];for(let c=6;c>=0;c--)coords.push([6,c]);for(let r=5;r>=0;r--)coords.push([r,0]);for(let c=1;c<=6;c++)coords.push([0,c]);for(let r=1;r<=5;r++)coords.push([r,6]); // perimeter 24 cells in order clockwise
const colors=['#46b6df','#ef7e58','#d8bd42','#b68be8'];
function newGame(){players=[{name:'أنت',money:300,pos:0,owned:[],jail:0,ai:false},{name:'منافس 1',money:300,pos:0,owned:[],jail:0,ai:true},{name:'منافس 2',money:300,pos:0,owned:[],jail:0,ai:true},{name:'منافس 3',money:300,pos:0,owned:[],jail:0,ai:true}];turn=0;rolled=false;finished=false;pending=null;render();say('بدأت اللعبة! تحتاج إلى رقم 6 للخروج من البداية.');document.getElementById('roll').disabled=false;document.getElementById('end').disabled=true;document.getElementById('buy').disabled=true;closeModal();saveGame(false)}
function render(){const b=document.getElementById('board');b.querySelectorAll('.tile').forEach(x=>x.remove());cities.forEach((t,i)=>{let [r,c]=coords[i];let el=document.createElement('div');el.className='tile';el.style.gridRow=r+1;el.style.gridColumn=c+1;let owner=players.findIndex(p=>p.owned.includes(i));let tokens=players.filter(p=>p.pos===i).map(p=>'<span style="color:'+colors[players.indexOf(p)]+'">●</span>').join('');el.innerHTML=(t[3]?'<i class="band" style="background:'+t[3]+'"></i>':'')+'<strong>'+t[0]+'</strong><small>'+(t[2]?t[2]+' جنيه':t[1]==='start'?'مرور +100':'')+'</small><small>'+(owner>=0?'مالك: '+players[owner].name:'')+'</small><div class="tokens">'+tokens+'</div>';b.appendChild(el)});document.getElementById('players').innerHTML=players.map((p,i)=>'<div class="player '+(i===turn?'active':'')+'"><span class="dot" style="background:'+colors[i]+'"></span><b>'+p.name+'</b><span style="margin-right:auto">'+p.money+' ج</span></div>').join('');document.getElementById('turnLabel').textContent='الدور: '+players[turn].name;document.getElementById('roll').disabled=rolled||finished||players[turn].ai;document.getElementById('buy').disabled=!pending||pending.type!=='buy'||players[turn].ai;document.getElementById('end').disabled=!rolled||players[turn].ai}
function say(s){document.getElementById('status').textContent=s}
function diceAnim(){const d=document.getElementById('dice');let n=0;let timer=setInterval(()=>{d.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)]+' '+['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];if(++n>8)clearInterval(timer)},75)}
function rollDice(){if(rolled||finished)return;diceAnim();setTimeout(()=>{let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b;document.getElementById('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][a-1]+' '+['⚀','⚁','⚂','⚃','⚄','⚅'][b-1];moveCurrent(sum)},650)}
function moveCurrent(steps){let p=players[turn];rolled=true;if(p.jail>0){p.jail--;if(steps===6||p.jail===0){p.pos=13;say(p.name+' خرج من السجن.');}else{say(p.name+' في السجن، تبقى '+p.jail+' دور.');render();return}}else if(p.pos===0&&steps!==6){say('لم تحصل على 6؛ تبقى في البداية.');render();afterMove();return}else{let old=p.pos;p.pos=(p.pos+steps)%24;if(old+steps>=24){p.money+=100;say('مررت بالبداية وحصلت على 100 جنيه!')}else say(p.name+' تحرك '+steps+' خطوات.')}
resolveTile();render()}
function resolveTile(){let p=players[turn],t=cities[p.pos];pending=null;if(t[1]==='city'){let owner=players.findIndex(x=>x.owned.includes(p.pos));if(owner<0){if(p.money>=t[2]){pending={type:'buy',index:p.pos};say('مدينة '+t[0]+' معروضة للبيع بسعر '+t[2]+' جنيه.')}else say('رصيدك لا يكفي لشراء '+t[0]+'.')}else if(owner!==turn){let rent=Math.max(15,Math.round(t[2]*.3));p.money-=rent;players[owner].money+=rent;say('دفعت '+rent+' جنيه إيجاراً إلى '+players[owner].name+'.');checkBankruptcy()}else say('هذه مدينتك! لا تدفع إيجاراً.')}
else if(t[1]==='chance'){let cards=[['ربحت جائزة مسابقة!','money',80],['دفعت فاتورة طارئة.','loss',50],['هدية من صديق.','money',40],['غرامة مرورية.','loss',30],['استثمار ناجح!','money',100]];let x=cards[Math.floor(Math.random()*cards.length)];p.money+=x[1]==='money'?x[2]:-x[2];say('بطاقة حظ: '+x[0]+' '+(x[1]==='money'?'+':'-')+x[2]+' جنيه.');checkBankruptcy()}
else if(t[1]==='court'){let fee=40;p.money-=fee;say('المحكمة: غرامة '+fee+' جنيه.');checkBankruptcy()}
else if(t[1]==='bus'){let dest=(p.pos+2)%24;p.pos=dest;say('الأتوبيس السريع! تقدمت خطوتين إلى '+cities[dest][0]+'.');resolveTile()}
else if(t[1]==='jail'){p.jail=2;say('ذهبت إلى السجن! ستنتظر دورين أو تخرج برمية 6.')}
else if(t[1]==='start')say('وصلت إلى نقطة البداية!')}
function buyProperty(){if(!pending||pending.type!=='buy')return;let p=players[turn],i=pending.index,c=cities[i];p.money-=c[2];p.owned.push(i);say('مبروك! أصبحت '+c[0]+' ملكك.');pending=null;render();saveGame(false)}
function checkBankruptcy(){let p=players[turn];if(p.money<0){say(p.name+' أفلس وخرج من المنافسة!');p.owned.forEach(i=>{});p.owned=[];p.money=0;p.eliminated=true;if(players.filter(x=>!x.eliminated).length===1){finished=true;showModal('انتهت اللعبة','الفائز هو '+players.find(x=>!x.eliminated).name+'!');}}}
function endTurn(){if(!rolled)return;pending=null;turn=(turn+1)%4;let guard=0;while(players[turn].eliminated&&guard++<4)turn=(turn+1)%4;rolled=false;render();saveGame(false);if(players[turn].ai)setTimeout(aiTurn,700)}
function aiTurn(){if(finished)return;let p=players[turn];if(!p||!p.ai)return;let steps=1+Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6);moveCurrent(steps);if(pending&&pending.type==='buy'){let cost=cities[pending.index][2];if(p.money-cost>=80){p.money-=cost;p.owned.push(pending.index);say(p.name+' اشترى '+cities[pending.index][0]+'.')}else say(p.name+' لم يشتر المدينة.');pending=null}render();setTimeout(()=>{if(!finished)endTurnAI()},700)}
function endTurnAI(){pending=null;turn=(turn+1)%4;let guard=0;while(players[turn].eliminated&&guard++<4)turn=(turn+1)%4;rolled=false;render();saveGame(false);if(players[turn].ai)setTimeout(aiTurn,700)}
function saveGame(show=true){try{localStorage.setItem('bankalhaz_save',JSON.stringify({players,turn,rolled:false}));if(show)say('تم حفظ اللعبة على جهازك.')}catch(e){if(show)say('تعذر حفظ اللعبة.')} }
function loadGame(){try{let d=JSON.parse(localStorage.getItem('bankalhaz_save'));if(!d)throw 0;players=d.players;turn=d.turn||0;rolled=false;pending=null;finished=false;render();say('تم استكمال اللعبة المحفوظة.')}catch(e){say('لا توجد لعبة محفوظة بعد.')} }
function showModal(title,body){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').textContent=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function showRules(){showModal('قواعد بنك الحظ','كل لاعب يبدأ بـ300 جنيه. يجب رمي 6 لمغادرة البداية. عند المرور بالبداية تحصل على 100 جنيه. اشترِ المدن لتجمع الإيجار من منافسيك. بطاقة الحظ قد تمنحك مالاً أو تفرض غرامة. الأتوبيس ينقلك خطوتين. المحكمة تفرض غرامة، والسجن يعطلك دورين أو حتى ترمي 6.');}
function confirmExit(){showModal('الخروج من اللعبة','تم حفظ تقدمك. هل تريد إغلاق اللعبة؟');}
newGame();
</script></body></html>
